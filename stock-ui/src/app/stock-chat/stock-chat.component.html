<div class="box">
  <h2>StockAssistant 智能体</h2>

  <div class="chat-container">
    <div *ngIf="catalogError" class="error">
      {{ catalogError }}
    </div>

    <div *ngIf="agents.length" class="agent-options">
      <label>
        智能体
        <select [(ngModel)]="selectedAgentId" (ngModelChange)="onAgentChange()">
          <option *ngFor="let agent of agents" [ngValue]="agent.id">
            {{ agent.name }}
          </option>
        </select>
      </label>
      <span class="agent-description">{{ selectedAgentDescription }}</span>
      <label>
        命令
        <select [(ngModel)]="selectedCommandId">
          <option *ngFor="let command of availableCommands" [ngValue]="command.id">
            {{ command.name }}
          </option>
        </select>
      </label>
      <span class="agent-description">{{ selectedCommandDescription }}</span>
    </div>

    <div class="input-group">
      <input [(ngModel)]="userQuestion" placeholder="请输入问题..." />
      <button (click)="sendChat()" [disabled]="isLoading || !selectedAgentId">发送</button>
    </div>

    <div *ngIf="isLoading" class="status">
      <span class="spinner"></span> 正在思考中...
    </div>

    <div *ngIf="apiError" class="error">
      {{ apiError }}
    </div>

    <div *ngIf="chatAnswer" class="answer-box">
      <h3>AI 回复：</h3>
      <div class="answer-content">{{ chatAnswer }}</div>
    </div>
  </div>
</div>
