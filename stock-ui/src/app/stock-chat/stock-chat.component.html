<div class="box">
  <h2>StockAssistant 智能体</h2>

  <div class="chat-container">
    <div class="input-group">
      <input
        [(ngModel)]="userQuestion"
        placeholder="请输入问题..."
        (keyup.enter)="sendChat()"
      />
      <button (click)="sendChat()" [disabled]="isLoading || !userQuestion.trim()">发送</button>
    </div>

    <div *ngIf="isLoading" class="status">
      <span class="spinner"></span> 正在思考中...
    </div>

    <div *ngIf="apiError" class="error">
      {{ apiError }}
    </div>

    <div *ngIf="chatAnswer" class="answer-box">
      <div class="answer-header">
        <h3>AI 回复：</h3>
        <button
          type="button"
          class="copy-button"
          (click)="copyAnswer()"
          [disabled]="copyState !== 'idle'"
        >
          {{ copyLabel }}
        </button>
      </div>
      <div class="answer-content markdown-body" [innerHTML]="chatAnswer | markdown"></div>
    </div>
  </div>
</div>
